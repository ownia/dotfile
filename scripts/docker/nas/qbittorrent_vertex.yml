services:
  qbittorrent_vertex:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent_vertex
    restart: always
    ports:
      - 8092:8092
      - 16882:16882
      - 16882:16882/udp
    volumes:
      - ./config:/config
      - /volume2/vertex_downloads:/downloads
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8092
      - TORRENTING_PORT=16882
